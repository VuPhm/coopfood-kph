services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coopfood_kph
      POSTGRES_USER: coopfood_kph
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopfood_kph -d coopfood_kph"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - coopfood-kph-postgres:/var/lib/postgresql/data

volumes:
  coopfood-kph-postgres:
