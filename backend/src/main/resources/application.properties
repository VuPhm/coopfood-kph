spring.application.name=coopfood-kph-backend

spring.datasource.url=${KPH_DATABASE_URL:jdbc:postgresql://localhost:5432/coopfood_kph}
spring.datasource.username=${KPH_DATABASE_USERNAME:kph_app}
spring.datasource.password=${KPH_DATABASE_PASSWORD:kph_local_dev}

spring.flyway.locations=classpath:db/migration
spring.jooq.sql-dialect=postgres

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${KPH_SESSION_COOKIE_SECURE:false}
