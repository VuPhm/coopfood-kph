spring.application.name=coopfood-kph-backend

spring.datasource.url=${KPH_DATABASE_URL:jdbc:postgresql://localhost:5432/coopfood_kph}
spring.datasource.username=${KPH_DATABASE_USERNAME:kph_app}
spring.datasource.password=${KPH_DATABASE_PASSWORD:kph_local_dev}

spring.flyway.locations=classpath:db/migration
spring.jooq.sql-dialect=postgres
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=KPH_SESSION
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${KPH_SESSION_COOKIE_SECURE:false}

# Local private evidence storage for Foundation-01. The directory is not served
# as static content; photos are readable only through the authenticated handler.
kph.media-root=${KPH_MEDIA_ROOT:./.data/kph-media}
