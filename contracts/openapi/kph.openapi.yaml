openapi: 3.1.0
info:
  title: Co.op Food KPH API
  version: 1.0.0-foundation
  description: |
    Contract-first boundary for the Store PWA and backend foundation.
    Business dates use ISO `yyyy-mm-dd` on the wire and `dd/mm/yyyy` in the UI.
    The business timezone is `Asia/Ho_Chi_Minh`. Store and actor authority always
    comes from the authenticated server-side session, never from mutation bodies.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: Operations
  - name: Auth
  - name: Stores
  - name: Catalog
  - name: KPH
  - name: Admin lifecycle
  - name: Admin catalog
security:
  - sessionCookie: []
paths:
  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Process is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a server-side session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Read current actor, roles and store memberships
      responses:
        '200':
          description: Current authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/password/change:
    post:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: Change the authenticated user's password
      description: |
        Verifies the current password, applies the published password policy,
        writes a new algorithm-prefixed hash and invalidates every session issued
        before this change. Password values are never returned or audited.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; the current session is invalidated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/CredentialValidation'

  /api/v1/stores:
    get:
      tags: [Stores]
      operationId: listMyStores
      summary: List active store memberships of the current actor
      responses:
        '200':
          description: Memberships visible to the session actor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreContext'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/catalog/barcodes/{barcode}:
    get:
      tags: [Catalog]
      operationId: lookupBarcode
      summary: Resolve a barcode to zero or one current active product
      description: |
        Reads only the published current catalog. `NOT_FOUND` never includes a
        guessed product and the response is never a collection.
        Requires active membership in the requested store; global roles do not
        bypass membership. Returns 503 when no current catalog exists or a
        matching product has no explicitly designated primary supplier.
      parameters:
        - $ref: '#/components/parameters/BarcodePath'
        - name: storeId
          in: query
          required: true
          description: Requested store scope, revalidated against active membership.
          schema:
            type: string
            format: uuid
          example: 10000000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Deterministic `FOUND` or `NOT_FOUND` result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/stores/{storeId}/kph:
    get:
      tags: [KPH]
      operationId: listKphRecords
      summary: List KPH records for one authorized store
      description: Store membership is revalidated by the backend.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/KphType'
        - name: detectedFrom
          in: query
          required: false
          description: Inclusive lower bound of the KPH detected date.
          schema:
            type: string
            format: date
        - name: detectedTo
          in: query
          required: false
          description: Inclusive upper bound of the KPH detected date. Must not precede detectedFrom.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Store-scoped history, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KphRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [KPH]
      operationId: createKphRecord
      summary: Create one KPH record with one to three evidence photos
      description: |
        The backend resolves the barcode against the current catalog again and
        persists a catalog snapshot. If it is not found, manual values are stored
        with `NOT_FOUND`; the backend must not infer a product. Store and actor
        values are derived from the authorized session.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload, photos]
              properties:
                payload:
                  $ref: '#/components/schemas/KphCreateRequest'
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: application/json
      responses:
        '201':
          description: Record persisted with immutable catalog/store/actor snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KphRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/stores/{storeId}/kph/{recordId}/approval:
    put:
      tags: [KPH]
      operationId: reviewKphRecord
      summary: Set the approval decision for one KPH record
      description: |
        Only a STORE_MANAGER with an active membership in this exact store may
        review a record. Global CHAIN_ADMIN does not bypass store membership or
        the STORE_MANAGER role. Every state change is appended to review history
        and the audit trail; repeating the same decision is idempotent.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KphApprovalRequest'
      responses:
        '200':
          description: Current record including the persisted review decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KphRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/stores/{storeId}/kph/exports:
    post:
      tags: [KPH]
      operationId: prepareKphExport
      summary: Authorize and snapshot one online KPH Excel export
      description: |
        Only a STORE_MANAGER with active membership may export. All requested
        records must belong to this store, share the requested type, remain
        SUBMITTED and already be APPROVED. The response is the authoritative
        ordered snapshot used by the Store PWA to build the workbook; the backend
        records one audit event for the export selection.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KphExportRequest'
      responses:
        '200':
          description: Authorized export snapshot in the same order as recordIds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KphExportBundle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/stores/{storeId}/kph/{recordId}/photos/{ordinal}:
    get:
      tags: [KPH]
      operationId: getStampedKphPhoto
      summary: Read one private stamped evidence photo
      description: Original evidence remains private and is not exposed by this endpoint.
      parameters:
        - $ref: '#/components/parameters/StoreIdPath'
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ordinal
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3
      responses:
        '200':
          description: Private stamped JPEG with no-store cache policy.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/lifecycle/targets:
    get:
      tags: [Admin lifecycle]
      operationId: listLifecycleTargets
      summary: List active region/store targets the actor may schedule
      description: |
        CHAIN_ADMIN sees active regions and stores chain-wide. REGION_MANAGER
        sees active stores only in active assigned regions. The backend derives
        every effective region from PostgreSQL.
      responses:
        '200':
          description: Authorized active lifecycle targets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LifecycleTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/lifecycle/schedules:
    get:
      tags: [Admin lifecycle]
      operationId: listLifecycleSchedules
      summary: List lifecycle schedules visible to the actor
      responses:
        '200':
          description: Schedules newest first, constrained to current actor scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LifecycleSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin lifecycle]
      operationId: createLifecycleSchedule
      summary: Schedule a store or region deactivation at least 30 days ahead
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleScheduleCreateRequest'
      responses:
        '201':
          description: Deactivation schedule created; the target remains active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/LifecycleValidation'

  /api/v1/admin/lifecycle/schedules/{scheduleId}:
    put:
      tags: [Admin lifecycle]
      operationId: rescheduleLifecycleDeactivation
      summary: Move a pending lifecycle schedule to another valid effective date
      parameters:
        - $ref: '#/components/parameters/ScheduleIdPath'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleRescheduleRequest'
      responses:
        '200':
          description: Pending schedule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/LifecycleValidation'

  /api/v1/admin/lifecycle/schedules/{scheduleId}/cancel:
    post:
      tags: [Admin lifecycle]
      operationId: cancelLifecycleSchedule
      summary: Cancel a pending lifecycle schedule without deleting its history
      parameters:
        - $ref: '#/components/parameters/ScheduleIdPath'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleReasonRequest'
      responses:
        '200':
          description: Schedule marked cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

        '422':
          $ref: '#/components/responses/LifecycleValidation'

  /api/v1/admin/lifecycle/schedules/{scheduleId}/execute:
    post:
      tags: [Admin lifecycle]
      operationId: executeLifecycleSchedule
      summary: Manually execute a due lifecycle schedule
      description: |
        The backend locks and revalidates schedule state, effective date,
        target state, actor scope and lifecycle guards in the same transaction.
      parameters:
        - $ref: '#/components/parameters/ScheduleIdPath'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleReasonRequest'
      responses:
        '200':
          description: Target deactivated and schedule marked executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

        '422':
          $ref: '#/components/responses/LifecycleValidation'

  /api/v1/admin/catalog/imports:
    get:
      tags: [Admin catalog]
      operationId: listCatalogImports
      summary: List the latest immutable catalog staging batches
      description: Requires active CATALOG_ADMIN; CHAIN_ADMIN is not an implicit catalog role.
      responses:
        '200':
          description: At most 50 batches, newest first. Staging never affects store lookup.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin catalog]
      operationId: uploadCatalogImport
      summary: Validate and persist one UTF-8 catalog CSV as an immutable staging batch
      description: |
        The exact required header is `NCC,Tên NCC,UPC,SKU,Tên sản phẩm`.
        Identifier fields remain strings. Replaying the exact file bytes returns
        the existing batch with `replayed=true`; this endpoint never publishes.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Exact bytes were already staged; existing immutable batch returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportUploadResponse'
        '201':
          description: New batch validated and persisted as VALIDATED or REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/CatalogImportValidation'

  /api/v1/admin/catalog/imports/{batchId}:
    get:
      tags: [Admin catalog]
      operationId: getCatalogImport
      summary: Read one staging batch and all row-level validation results
      parameters:
        - $ref: '#/components/parameters/CatalogBatchIdPath'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Immutable batch detail ordered by source row number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: KPH_SESSION

  parameters:
    StoreIdPath:
      name: storeId
      in: path
      required: true
      description: Requested scope; membership remains authoritative on the server.
      schema:
        type: string
        format: uuid
    BarcodePath:
      name: barcode
      in: path
      required: true
      description: Exact string identifier; leading zeroes are significant.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key scoped to the authenticated actor.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogBatchIdPath:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required or credentials invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: CSRF validation failed or the actor lacks authority.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist in the authorized scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency key conflict or concurrent state conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    LifecycleValidation:
      description: Invalid lifecycle date or reason; code identifies the failed rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogImportValidation:
      description: File encoding, header, CSV structure or row limit is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CredentialValidation:
      description: Current password or new-password policy validation failed; code identifies the rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Uploaded file exceeds the endpoint limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required infrastructure is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          format: password
          description: 15–64 Unicode code points; the server evaluates the full value without trimming or normalization.
          minLength: 1
          maxLength: 256

    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrfToken:
          type: string

    SessionUser:
      type: object
      additionalProperties: false
      required: [id, username, displayName, globalRoles, stores]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        globalRoles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GlobalRole'
        stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreContext'

    GlobalRole:
      type: string
      enum: [CATALOG_ADMIN, CHAIN_ADMIN]

    StoreRole:
      type: string
      enum: [EMPLOYEE, STORE_MANAGER]

    StoreContext:
      type: object
      additionalProperties: false
      required: [id, code, name, role]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: String identifier; leading zeroes are significant.
        name:
          type: string
        role:
          $ref: '#/components/schemas/StoreRole'

    LifecycleTargetType:
      type: string
      enum: [REGION, STORE]

    LifecycleScheduleStatus:
      type: string
      enum: [SCHEDULED, CANCELLED, EXECUTED]

    LifecycleTarget:
      type: object
      additionalProperties: false
      required: [type, id, code, name, regionId, regionCode, regionName]
      properties:
        type:
          $ref: '#/components/schemas/LifecycleTargetType'
        id:
          type: string
          format: uuid
        code:
          type: string
          description: String identifier; leading zeroes are significant.
        name:
          type: string
        regionId:
          type: [string, 'null']
          format: uuid
        regionCode:
          type: [string, 'null']
        regionName:
          type: [string, 'null']

    LifecycleSchedule:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - effectiveDate
        - status
        - reason
        - createdBy
        - createdAt
        - updatedBy
        - updatedAt
        - cancelledAt
        - executedAt
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/LifecycleTarget'
        effectiveDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LifecycleScheduleStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        createdBy:
          $ref: '#/components/schemas/ActorSnapshot'
        createdAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/ActorSnapshot'
        updatedAt:
          type: string
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        executedAt:
          type: [string, 'null']
          format: date-time

    LifecycleScheduleCreateRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, effectiveDate, reason]
      properties:
        targetType:
          $ref: '#/components/schemas/LifecycleTargetType'
        targetId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    LifecycleRescheduleRequest:
      type: object
      additionalProperties: false
      required: [effectiveDate, reason]
      properties:
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    LifecycleReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    CatalogImportStatus:
      type: string
      enum: [STAGED, VALIDATED, PUBLISHED, REJECTED]

    CatalogImportRowStatus:
      type: string
      enum: [VALID, WARNING, ERROR]

    CatalogImportBatch:
      type: object
      additionalProperties: false
      required:
        - id
        - checksumSha256
        - originalFilename
        - fileSizeBytes
        - status
        - rowCount
        - validRowCount
        - errorRowCount
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        originalFilename:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 5242880
        status:
          $ref: '#/components/schemas/CatalogImportStatus'
        rowCount:
          type: integer
          minimum: 0
        validRowCount:
          type: integer
          minimum: 0
        errorRowCount:
          type: integer
          minimum: 0
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/ActorSnapshot'
            - type: 'null'
          description: Null only for legacy batches created before C01 actor provenance.
        createdAt:
          type: string
          format: date-time

    CatalogImportUploadResponse:
      type: object
      additionalProperties: false
      required: [batch, replayed]
      properties:
        batch:
          $ref: '#/components/schemas/CatalogImportBatch'
        replayed:
          type: boolean

    CatalogImportDetail:
      type: object
      additionalProperties: false
      required: [batch, rows, rowTotal, rowOffset, rowLimit]
      properties:
        batch:
          $ref: '#/components/schemas/CatalogImportBatch'
        rows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CatalogImportRow'
        rowTotal:
          type: integer
          minimum: 0
        rowOffset:
          type: integer
          minimum: 0
        rowLimit:
          type: integer
          minimum: 1
          maximum: 500

    CatalogImportRow:
      type: object
      additionalProperties: false
      required: [rowNumber, status, raw, normalized, validationMessages]
      properties:
        rowNumber:
          type: integer
          minimum: 2
        status:
          $ref: '#/components/schemas/CatalogImportRowStatus'
        raw:
          $ref: '#/components/schemas/CatalogRowValues'
        normalized:
          $ref: '#/components/schemas/CatalogRowValues'
        validationMessages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogValidationMessage'

    CatalogRowValues:
      type: object
      additionalProperties: false
      required: [supplierCode, supplierName, barcode, skuCode, productName]
      properties:
        supplierCode:
          type: string
        supplierName:
          type: string
        barcode:
          type: string
        skuCode:
          type: string
        productName:
          type: string

    CatalogValidationMessage:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string

    BarcodeLookupResponse:
      oneOf:
        - $ref: '#/components/schemas/BarcodeFound'
        - $ref: '#/components/schemas/BarcodeNotFound'
      discriminator:
        propertyName: status
        mapping:
          FOUND: '#/components/schemas/BarcodeFound'
          NOT_FOUND: '#/components/schemas/BarcodeNotFound'

    BarcodeFound:
      type: object
      additionalProperties: false
      required: [status, barcode, product]
      properties:
        status:
          type: string
          const: FOUND
        barcode:
          type: string
        product:
          $ref: '#/components/schemas/CatalogProduct'

    BarcodeNotFound:
      type: object
      additionalProperties: false
      required: [status, barcode]
      properties:
        status:
          type: string
          const: NOT_FOUND
        barcode:
          type: string

    CatalogProduct:
      type: object
      additionalProperties: false
      required: [id, barcode, skuCode, name, primarySupplier]
      properties:
        id:
          type: string
          format: uuid
        barcode:
          type: string
        skuCode:
          type: string
        name:
          type: string
        primarySupplier:
          $ref: '#/components/schemas/SupplierSnapshot'

    SupplierSnapshot:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string

    KphType:
      type: string
      enum: [TPCN, TPTS]

    KphUnit:
      type: string
      enum: [EA, kg]

    KphCondition:
      type: string
      enum: [NEAR_EXPIRY, EXPIRED, TORN_PACKAGING, VACUUM_LEAK, BRUISED_WATERLOGGED, ROTTEN_MOLDY, OTHER]

    KphResolution:
      type: string
      enum: [CANCEL, EXCHANGE, RETURN, OTHER]

    KphLookupStatus:
      type: string
      enum: [FOUND, NOT_FOUND, MANUAL]

    KphLifecycleState:
      type: string
      enum: [SUBMITTED, INVALIDATED]

    KphApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    KphApprovalRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/KphApprovalStatus'

    KphExportRequest:
      type: object
      additionalProperties: false
      required: [type, recordIds]
      properties:
        type:
          $ref: '#/components/schemas/KphType'
        recordIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid

    KphExportBundle:
      type: object
      additionalProperties: false
      required: [exportId, exportedAt, store, records]
      properties:
        exportId:
          type: string
          format: uuid
        exportedAt:
          type: string
          format: date-time
        store:
          $ref: '#/components/schemas/KphStoreSnapshot'
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/KphRecord'

    KphCreateRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - detectedDate
        - quantity
        - unit
        - condition
        - resolution
      description: |
        TPCN conditions: NEAR_EXPIRY, EXPIRED, TORN_PACKAGING, VACUUM_LEAK,
        OTHER; resolutions: CANCEL, EXCHANGE, RETURN, OTHER. TPTS conditions:
        BRUISED_WATERLOGGED, ROTTEN_MOLDY, NEAR_EXPIRY, EXPIRED, OTHER; it only
        allows CANCEL or OTHER.
        EA quantity must be a positive whole number; kg accepts a positive
        decimal quantity.
        OTHER detail is optional and normalizes to the Vietnamese legacy label
        when blank. At least one of barcode/manualSkuCode/manualProductName is
        required. Actor and store fields are deliberately absent.
      properties:
        type:
          $ref: '#/components/schemas/KphType'
        detectedDate:
          type: string
          format: date
          description: Current Asia/Ho_Chi_Minh business date; the Store PWA does not allow editing it.
        processedDate:
          type: [string, 'null']
          format: date
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: '#/components/schemas/KphUnit'
        condition:
          $ref: '#/components/schemas/KphCondition'
        conditionDetail:
          type: [string, 'null']
          maxLength: 255
        resolution:
          $ref: '#/components/schemas/KphResolution'
        resolutionDetail:
          type: [string, 'null']
          maxLength: 255
        barcode:
          type: [string, 'null']
          maxLength: 128
        manualSkuCode:
          type: [string, 'null']
          maxLength: 50
        manualProductName:
          type: [string, 'null']
          maxLength: 200
        manualSupplierName:
          type: [string, 'null']
          maxLength: 150
        note:
          type: [string, 'null']
          maxLength: 255
        photoLastModified:
          type: array
          maxItems: 3
          description: |
            Values align by photo ordinal. They are an evidence-stamp fallback,
            never an audit timestamp.
          items:
            type: [string, 'null']
            format: date-time
      oneOf:
        - type: object
          required: [unit, quantity]
          properties:
            unit:
              const: EA
            quantity:
              type: number
              exclusiveMinimum: 0
              multipleOf: 1
        - type: object
          required: [unit, quantity]
          properties:
            unit:
              const: kg
            quantity:
              type: number
              exclusiveMinimum: 0

    KphRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - detectedDate
        - quantity
        - unit
        - condition
        - resolution
        - lookupStatus
        - catalogSnapshot
        - lifecycleState
        - approvalStatus
        - reviewedBy
        - reviewedAt
        - store
        - detectedBy
        - photos
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/KphType'
        detectedDate:
          type: string
          format: date
        processedDate:
          type: [string, 'null']
          format: date
        quantity:
          type: number
        unit:
          $ref: '#/components/schemas/KphUnit'
        condition:
          $ref: '#/components/schemas/KphCondition'
        conditionDetail:
          type: [string, 'null']
        resolution:
          $ref: '#/components/schemas/KphResolution'
        resolutionDetail:
          type: [string, 'null']
        barcode:
          type: [string, 'null']
        lookupStatus:
          $ref: '#/components/schemas/KphLookupStatus'
        catalogSnapshot:
          $ref: '#/components/schemas/KphCatalogSnapshot'
        lifecycleState:
          $ref: '#/components/schemas/KphLifecycleState'
        approvalStatus:
          $ref: '#/components/schemas/KphApprovalStatus'
        reviewedBy:
          oneOf:
            - $ref: '#/components/schemas/ActorSnapshot'
            - type: 'null'
        reviewedAt:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
        store:
          $ref: '#/components/schemas/KphStoreSnapshot'
        detectedBy:
          $ref: '#/components/schemas/ActorSnapshot'
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/KphPhoto'
        createdAt:
          type: string
          format: date-time

    KphCatalogSnapshot:
      type: object
      additionalProperties: false
      required: [skuCode, productName, supplierCode, supplierName]
      description: Immutable values captured when the KPH record is created.
      properties:
        skuCode:
          type: [string, 'null']
        productName:
          type: [string, 'null']
        supplierCode:
          type: [string, 'null']
        supplierName:
          type: [string, 'null']

    KphStoreSnapshot:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    ActorSnapshot:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    KphPhoto:
      type: object
      additionalProperties: false
      required: [ordinal, stampedContentPath, capturedAt]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 3
        stampedContentPath:
          type: string
          description: Relative authenticated API path; never a public object URL.
        capturedAt:
          type: string
          format: date-time
          description: Evidence timestamp selected by precedence rules, not audit time.

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable application error code.

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [violations]
          properties:
            violations:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'

    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
